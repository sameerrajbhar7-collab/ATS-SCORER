name: ATS-SCORER CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # =========================
  # 1. TEST
  # =========================
  test:
    name: Test ATS Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python Syntax Check
        run: |
          python -m compileall backend

      - name: Run Tests
        run: |
          pytest -v || true


  # =========================
  # 2. BUILD & PUSH
  # =========================
  build:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.username }}/ats-scorer:latest
            ${{ secrets.username }}/ats-scorer:${{ github.sha }}


  # =========================
  # 3. DEPLOY TO EC2
  # =========================
  deploy:
    name: Deploy ATS to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "=============================="
            echo "Pulling latest ATS image"
            echo "=============================="

            docker pull ${{ secrets.username }}/ats-scorer:latest


            echo "=============================="
            echo "Stopping old container"
            echo "=============================="

            docker rm -f ats-scorer 2>/dev/null || true


            echo "=============================="
            echo "Starting new container"
            echo "=============================="

            docker run -d \
              --name ats-scorer \
              --env-file .env \
              -p 8000:8000 \
              ${{ secrets.username }}/ats-scorer:latest


            echo "=============================="
            echo "Checking container"
            echo "=============================="

            sleep 5

            docker ps --filter "name=ats-scorer"


            echo "=============================="
            echo "Container logs"
            echo "=============================="

            docker logs --tail 30 ats-scorer


            echo "=============================="
            echo "Cleaning old images"
            echo "=============================="

            docker image prune -f

            echo "=============================="
            echo "ATS deployment completed!"
            echo "=============================="